<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#0b0d12" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Srdce" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<title>Srdce a Hvezda</title>
<style>
:root{--ink:#efe8dc;--dim:#9aa0ad;--btn:#f3eadc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#07080c;color:var(--ink);font-family:Georgia,serif;overflow:hidden}
header.bar{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:12px;padding:10px 16px;background:linear-gradient(#07080ce6,#07080c00)}
header a{color:var(--ink);text-decoration:none}
header strong{margin-left:auto;font-size:.85rem}
.lang{border:1px solid #efe8dc55;background:transparent;color:var(--ink);border-radius:99px;padding:6px 12px}
canvas{display:block;width:100vw;height:100dvh}
.panel{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;justify-content:flex-end;padding:24px 22px 28px;background:linear-gradient(#0000 20%,#07080cf2 62%)}
.panel[hidden],.hud[hidden]{display:none!important}
.eyebrow{letter-spacing:.18em;text-transform:uppercase;font-size:.68rem;color:var(--dim)}
h1{font-size:clamp(2rem,8vw,3.2rem);font-weight:500}
.btn{border:0;background:var(--btn);color:#161410;border-radius:99px;padding:14px 22px;font:700 1rem system-ui}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid #efe8dc55}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0;max-height:42vh;overflow:auto}
.lvl{text-align:left;border:1px solid #efe8dc22;background:#11141c;color:var(--ink);border-radius:14px;padding:10px 8px;min-height:72px}
.lvl[disabled]{opacity:.35}.lvl.done{border-color:#d4a84b88}
.hud{position:fixed;left:0;right:0;bottom:0;z-index:3;display:flex;padding:12px 16px}
.jump{flex:1;height:64px;border:0;border-radius:18px;background:#f3eadc;font:800 1.1rem system-ui}
.hint{position:fixed;top:58px;left:16px;color:#c9c3b6}
.row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
</style></head>
<body>
<header class="bar"><a href="index.html">Blaho + Helle</a><strong id="now">1 / 12</strong><button class="lang" id="langBtn">EN</button></header>
<canvas id="c"></canvas>
<p class="hint" id="hint" hidden></p>
<div class="hud" id="hud" hidden><button class="jump" id="jumpBtn">SKOK</button></div>
<section class="panel" id="map"><p class="eyebrow" id="mapEy">Plosinovka do dlane</p><h1 id="mapH">Srdce a Hvezda</h1><p id="mapP">12 nano svetu. Srdce bezi. Ty skaces.</p><div class="grid" id="grid"></div><div class="row"><button class="btn" id="go">Novy beh</button></div></section>
<section class="panel" id="done" hidden><p class="eyebrow" id="doneEy">Svet</p><h2 id="doneH"></h2><p id="doneP"></p><div class="row"><button class="btn" id="next">Dalsi</button><button class="btn ghost" id="back">Svety</button></div></section>
<section class="panel" id="fail" hidden><h2 id="failH">Pad</h2><p id="failP"></p><div class="row"><button class="btn" id="retry">Znovu</button><button class="btn ghost" id="failMap">Svety</button></div></section>
<script src="game.js"></script>
</body></html>
